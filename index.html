<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="필요한 물건은 가장 싸게, 안 쓰는 물건은 가장 쉽게 현금으로. VeryCheap 데모">
<script src="config.js"></script>
<title>VeryCheap 데모</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: sticky top bar + single content column (max 1180px); phone = bottom tab bar */
:root{
  --bg:#101014; --card:#1c1c22; --card2:#26262e; --line:#2c2c35;
  --fg:#f4f4f6; --sub:#a6a6b0; --mute:#7c7c87;
  --blue:#2f7bf0; --blueInk:#7fb0ff; --good:#ff5a65; --goodBg:#3a1d22; --used:#ffbf80; --up:#6f9dff;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blueInk);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(16,16,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid #1d1d24}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap}
.logo{font-weight:800;font-size:21px;letter-spacing:-.6px;text-decoration:none}
.nav{display:flex;gap:4px}
.nav a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--sub);font-weight:700;font-size:15px}
.nav a[aria-current="page"]{color:var(--fg);background:var(--card)}
.nav svg{display:none}
.src{margin-left:auto;font-size:12px;color:var(--sub);background:var(--card);border-radius:999px;padding:6px 12px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.src b{color:var(--used);font-weight:700}
main{padding-block:24px 64px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.3px}
.h1{font-size:26px;font-weight:800}
.h2{font-size:19px;font-weight:800}
.muted{color:var(--sub)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border-radius:20px;padding:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:38px;padding:0 15px;border-radius:999px;border:0;background:var(--card);color:#cfcfd6;font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg{display:inline-flex;background:var(--card2);border-radius:11px;padding:3px}
.seg button{min-height:34px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#4a4a55;color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--card2);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.block{width:100%}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:7px;padding:2px 7px;background:var(--card2);color:#cfcfd6;white-space:nowrap}
.tag.good{background:var(--goodBg);color:#ff9aa2}
.tag.hot{background:#e5313f;color:#fff}
.tag.new{background:#1b2a45;color:var(--blueInk)}
.tag.used{background:#45301c;color:var(--used)}
.good{color:var(--good)} .up{color:var(--up)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 16px;min-height:50px;flex:1 1 280px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:15px}
.thumb{position:relative;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb svg{width:46%;height:46%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 16px}
.pcard{text-decoration:none;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard .thumb{aspect-ratio:1/1;width:100%;max-width:100%}
.pcard .nm{font-size:15px;color:#d6d6dd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pcard .pr b{font-size:19px;font-weight:800}
.pcard .ov{position:absolute;left:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap}
.lbl{font-size:12px;font-weight:700}
.lbl.n{color:var(--blueInk)} .lbl.u{color:var(--used)}
.sec{display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}
.hscroll::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
.hero2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.act{background:var(--card);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0}
.act .eyebrow{font-size:13px;font-weight:800;letter-spacing:.04em}
.act.buy .eyebrow{color:var(--blueInk)} .act.sell .eyebrow{color:var(--used)}
.act .cash{font-size:30px;font-weight:800;letter-spacing:-.8px}
.act .search{background:var(--card2);flex:none;margin-top:6px}
.act.sell .btn{align-self:flex-start;margin-top:auto}
.rec{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;border:2px solid var(--blue)}
.sellbox{background:#2a2117;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){.hero2{grid-template-columns:minmax(0,1fr)}}
.rcard{flex:none;width:300px;max-width:85vw;background:var(--card);border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center;text-decoration:none}
.tablebox{overflow-x:auto;background:var(--card);border-radius:20px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:12px 16px;text-align:right;white-space:nowrap;font-size:14px}
th{font-size:12px;color:var(--sub);font-weight:500;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
tbody tr{border-bottom:1px solid #23232a;cursor:pointer}
tbody tr:hover{background:#22222a}
.tname{display:flex;align-items:center;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border-radius:18px;padding:16px 18px}
.stat b{display:block;font-size:22px;font-weight:800;margin-top:2px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
.prices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.ptile{min-width:0}.ptile b{font-size:clamp(18px,5vw,24px)!important;overflow-wrap:anywhere}
.ptile{background:var(--card);border-radius:18px;padding:14px 16px;border:2px solid transparent}
.ptile.best{border-color:var(--blue)}
.ptile b{display:block;font-size:24px;font-weight:800;margin:2px 0}
.banner{background:var(--goodBg);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}
.offer{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid #26262d;text-decoration:none}
.offer:first-of-type{border-top:0}
.badge{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv .tot{font-weight:800;border-top:1px solid var(--line);padding-top:8px}
.chart text{fill:var(--mute);font-size:11px;font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.notice{background:#1b2a45;color:#cfe0ff;border-radius:14px;padding:12px 14px;font-size:13px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px 12px}
.drop{border:1.5px dashed #4a4a55;border-radius:20px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--blueInk);background:#151a26}
.report li{margin:4px 0}
.ok{color:#8fe0a0} .warn{color:#ffcf70} .err{color:#ff8a8a}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f4f4f6;color:#101014;font-weight:700;padding:12px 18px;border-radius:14px;z-index:20;max-width:90vw}
.empty{padding:40px 16px;text-align:center;color:var(--sub)}
.radio{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:62px;padding:0 16px;border-radius:16px;background:var(--card);border:2px solid var(--line);cursor:pointer;text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--blue)}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades button{min-height:62px;border-radius:14px;border:0;background:var(--card);color:#cfcfd6;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grades button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
select,input[type=number]{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;font:inherit;width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.detail,.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  main{padding-bottom:110px}
  .top{backdrop-filter:none;background:var(--bg)}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#17171c;border-top:1px solid #26262e;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav a{flex-direction:column;gap:2px;font-size:11px;min-height:52px;padding:0 10px;background:transparent!important}
  .nav svg{display:block}
  .src{max-width:170px}
  .h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

  p.usedSave=p.newLow&&p.usedBuy?p.newLow-p.usedBuy.price:null;
  p.sold=p.useds.filter(u=>u.status==='판매완료').length;
  p.gradeRef={};for(const g of 'SABC'){const xs=p.useds.filter(u=>u.grade===g).map(u=>u.price);p.gradeRef[g]=xs.length?median(xs):(p.usedRef?p.usedRef*GRADE[g][1]/(GRADE[p.usedRef&&A.length?'A':'A'][1]):null)}
  p.idx=p.newLow&&p.usedRef?p.usedRef/p.newLow:null;
  p.resell=p.idx!=null&&p.idx>1;
  p.disc=p.list&&p.newLow?1-p.newLow/p.list:null;
  p.gap=p.resell?p.usedRef-p.newLow:0;
  p.gb=p.news.find(o=>o.channel==='공구'&&!o.stock)||null;
  let key=null;for(const [re,k] of ICRULE){if(re.test(p.name)){key=k;break}}
  p.icon=IC[key||CATIC[p.cat]||'box'];
  p.tile=TILE[p.cat]||['#2a2b33','#d0d2da'];
  if(p.hist.length>=2){const pts=p.hist.sort((a,b)=>a.date<b.date?-1:1);p.history={real:true,usedFlat:pts.every(x=>x.u==null),pts}}else p.history={real:false,pts:synth(p)};
  return p;
}
function synth(p){
  if(!p.newLow)return[];
  const r=rng(hash(p.id)),pts=[],N=13;const start=(p.list||p.newLow*1.12);const uEnd=p.usedRef;const uStart=uEnd?uEnd*(p.resell?0.85:1.12):null;
  const end=new Date();
  for(let i=0;i<N;i++){const t=i/(N-1);const d=new Date(end.getTime()-(N-1-i)*14*864e5);
    const n=i===N-1?p.newLow:start+(p.newLow-start)*t+(r()-.5)*0.05*p.newLow;
    const u=uEnd==null?null:(i===N-1?uEnd:uStart+(uEnd-uStart)*t+(r()-.5)*0.05*uEnd);
    pts.push({date:d.toISOString().slice(0,10),n:Math.round(n/100)*100,u:u==null?null:Math.round(u/1000)*1000})}
  return pts;
}

function getWallet(){
  const w=store.get(LS_WALLET);
  if(Array.isArray(w))return w.filter(h=>DB.by[h.pid]);
  const ex=[];const pick=f=>DB.list.filter(f)[0];
  const a=pick(p=>p.resell&&p.newLow),b=pick(p=>!p.resell&&p.cat==='디지털'&&p.newLow),c=pick(p=>!p.resell&&p.cat==='가전'&&p.newLow);
  [[a,.94,58],[b,.97,27],[c,.93,41]].forEach(([p,m,days])=>{if(p)ex.push({pid:p.id,price:Math.round(p.newLow*m/1000)*1000,date:new Date(Date.now()-days*864e5).toISOString().slice(0,10),example:true})});
  return ex;
}
function addToWallet(pid,price){
  let w=getWallet().filter(h=>!h.example);
  w.unshift({pid,price,date:new Date().toISOString().slice(0,10)});
  store.set(LS_WALLET,w);
}
function removeFromWallet(i){let w=getWallet().filter(h=>!h.example);w.splice(i,1);store.set(LS_WALLET,w)}

    ${!rows.length?`<div class="empty">아직 담은 물건이 없어요. 상품 상세에서 "샀어요"를 눌러 기록해보세요.</div>`:`
    <div class="seg" role="group" aria-label="보기"><button data-wm="sell" aria-pressed="${m==='sell'}">지금 팔면 받을 돈</button><button data-wm="save" aria-pressed="${m==='save'}">아낀 돈</button></div>
    <div><span class="muted">${m==='sell'?`내 물건 ${rows.length}개, 지금 중고로 팔면`:'정가 대비 아낀 돈'}</span>
    <div style="font-size:36px;font-weight:800;letter-spacing:-1px">${m==='sell'?won(sumSell):won(sumSaved)}</div>
    <span style="font-weight:700" class="${m==='sell'?'up':'good'}">${m==='sell'?`산 값 ${won(sumBuy)}의 ${pct(sumSell/sumBuy)} 회수`:`수익률 +${sumList?((sumSaved/sumList)*100).toFixed(1):0}%`}</span></div>
    <div class="wgrid">${sorted.map(r=>{const g=r.gain;return `<div class="pcard" style="gap:6px"><a href="#p-${esc(r.p.id)}" style="position:relative;display:block;text-decoration:none">${thumb(r.p)}<span class="ov">${m==='sell'?(g>0?`<span class="tag hot">산 값보다 +${Math.round(g/r.h.price*100)}%</span>`:`<span class="tag">회수 ${pct(r.sell/r.h.price)}</span>`):(r.saved>0?`<span class="tag hot">+${Math.round(r.saved/(r.p.list)*100)}%</span>`:'')}</span></a>
      <b class="ellip">${esc(r.p.name)}</b>
      <span class="muted small">${esc(r.h.date)} · ${won(r.h.price)}에 삼</span>
      ${m==='sell'?(r.sell==null?`<span class="small muted">중고 시세 없음</span>`:g>0?`<span class="small good" style="font-weight:700">산 값보다 ${won(g)} 더 받아요</span>`:`<span class="small muted">지금 팔면 ${won(r.sell)} · 하루 ${won(-g/r.days)}꼴</span>`):(r.saved!=null?`<span class="small good" style="font-weight:700">정가보다 ${won(r.saved)} 아낌</span>`:`<span class="small muted">정가 정보 없음</span>`)}
      <span class="row" style="gap:6px">${r.sell!=null?`<a class="tag" href="#sell" data-sellpid="${esc(r.p.id)}" data-buy="${r.h.price}" style="text-decoration:none;background:var(--blue);color:#fff">바로 팔기</a>`:''}${r.h.example?'<span class="tag">예시</span>':`<button class="tag" data-del="${r.i}" style="border:0;cursor:pointer">삭제</button>`}</span>
    </div>`}).join('')}</div>`}
  </div>`;
}

function vSell(){
  const wal=getWallet();
  if(!UI.sellPid||!DB.by[UI.sellPid]){const f=wal[0]?wal[0].pid:(DB.list.find(p=>p.usedRef)||DB.list[0]||{}).id;UI.sellPid=f;UI.buy=wal[0]?wal[0].price:null}
  const p=DB.by[UI.sellPid];if(!p)return `<div class="empty">상품 데이터가 없어요. <a href="#data">데이터</a>에서 시트를 불러와 주세요.</div>`;
  const ref=p.gradeRef[UI.grade];const opts=[['빨리 팔기',0.92,'시세보다 8% 낮게 · 가장 빨리 현금화'],['시세대로',1,'최근 거래 중간값'],['조금 높게',1.07,'시세보다 7% 높게 · 시간이 더 걸릴 수 있어요']];
  const sell=ref?Math.round(ref*opts[UI.popt][1]/1000)*1000:null;
  const buy=UI.buy??(wal.find(h=>h.pid===p.id)||{}).price??p.newLow;
  const gain=sell!=null&&buy?sell-buy:null;
  const inWal=new Set(wal.map(h=>h.pid));
  const options=[...DB.list].sort((a,b)=>(inWal.has(b.id)-inWal.has(a.id))||a.name.localeCompare(b.name,'ko'));
  return `
  <h1 class="h1">팔기</h1>
  <p class="muted" style="margin:4px 0 20px">최근 거래 시세로 가격을 정해요. 빨리 현금이 필요하면 '빨리 팔기'를 고르세요. 데모라서 실제로 등록되지는 않아요.</p>
  <div class="two">
    <div class="sec">
      <label class="f" for="sellPid">어떤 물건을 팔까요?<select id="sellPid">${options.map(o=>`<option value="${esc(o.id)}"${o.id===p.id?' selected':''}>${inWal.has(o.id)?'[내 지갑] ':''}${esc(o.name)}${o.option?' · '+esc(o.option):''}</option>`).join('')}</select></label>
      <div class="row">${thumb(p,72)}<span><b style="font-size:17px">${esc(p.name)}</b><br><span class="muted small">새상품 최저 ${won(p.newLow)} · 중고 ${p.useds.length}건</span></span></div>
      <div><span class="muted small">상태</span><div class="grades" style="margin-top:6px">${'SABC'.split('').map(g=>`<button data-grade="${g}" aria-pressed="${UI.grade===g}"><b>${g}급</b><span class="small">${GRADE[g][0]}</span></button>`).join('')}</div></div>
      <div><span class="muted small">가격 · ${UI.grade}급 시세 ${won(ref)}</span><div class="radio" style="margin-top:6px">${opts.map(([l,m,h],i)=>`<button class="opt" data-popt="${i}" aria-pressed="${UI.popt===i}"><span class="grow"><b>${l}</b><br><span class="muted small">${h}</span></span><b style="font-size:17px">${ref?won(Math.round(ref*m/1000)*1000):'—'}</b></button>`).join('')}</div></div>
      <label class="f" for="buyIn">산 가격 (원)<input id="buyIn" type="number" inputmode="numeric" min="0" step="1000" value="${buy??''}"></label>
    </div>
    <div class="sec">
      <div class="card sec" style="gap:10px">
        <span class="muted small">받을 수 있는 돈</span><b style="font-size:32px;letter-spacing:-.8px">${won(sell)}</b>
        ${gain==null?`<b style="font-size:22px">시세 정보가 부족해요</b>`:gain>0?`<b style="font-size:16px" class="good">산 값보다 ${won(gain)} 더 받아요 (+${Math.round(gain/buy*100)}%)</b>`:`<b style="font-size:16px">산 가격의 ${pct(sell/buy)} 회수 · ${won(-gain)} 쓴 셈</b>`}
        <div class="kv"><span class="muted">산 가격</span><span>${won(buy)}</span><span class="muted">팔 가격</span><span style="font-weight:700">${won(sell)}</span><span class="muted">지금 새상품 최저가</span><span>${won(p.newLow)}</span></div>
      </div>
      <button class="btn primary block" id="listIt" ${sell?'':'disabled'}>${sell?won(sell)+'에 매물 등록하기':'가격을 정할 수 없어요'}</button>
    </div>
  </div>`;
}

function vData(rep){
  const r=DB.list;
  return `
  <h1 class="h1">데이터</h1>
  <p class="muted" style="margin:4px 0 20px">지금 보는 데이터: <b style="color:var(--fg)">${esc(SRC.name)}</b> · 상품 ${r.length}개 · 새상품 판매처 ${r.reduce((s,p)=>s+p.news.length,0)}곳 · 중고 매물 ${r.reduce((s,p)=>s+p.useds.length,0)}건 · 가격 이력 ${r.filter(p=>p.history.real).length}개 상품</p>
  <div class="two">
    <div class="sec">
      <div class="drop" id="drop">
        <b style="font-size:17px">구글 시트를 .xlsx로 받아서 여기에 놓으세요</b>
        <span class="muted small">구글 시트에서 파일 → 다운로드 → Microsoft Excel(.xlsx)</span>
        <label class="btn primary" for="file" style="cursor:pointer">파일 선택</label>
        <input id="file" type="file" accept=".xlsx,.xls" hidden>
      </div>
      <div id="report">${rep||''}</div>
      <label class="f" for="apiUrl">Apps Script 웹 앱 URL (선택)<input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(store.get(LS_API)||'')}" style="background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;font:inherit"></label><span class="small muted">기본값은 config.js의 apiUrl이에요. 비워두면 같이 배포한 data.json을 써요.</span><div class="row"><button class="btn" id="saveApi">URL 저장 후 다시 불러오기</button>${saved||SRC.live?'<button class="btn" id="reset">기본 데이터로 되돌리기</button>':''}<button class="btn" id="resetWallet">내 지갑 기록 지우기</button></div>
    </div>
    <div class="card sec" style="gap:10px">
      <h2 class="h2" style="font-size:17px">시트 형식</h2>
      <span class="muted small">시트 이름과 1행 열 이름이 같아야 해요. 굵은 열은 필수예요. 가격은 원 단위 숫자.</span>
      ${Object.entries(SCHEMA).map(([s,cols])=>`<div><b>${s}</b>${s==='price_history'?' <span class="muted small">(선택)</span>':''}<div class="small muted" style="margin-top:2px">${cols.map(c=>REQUIRED[s].includes(c)?`<b style="color:var(--fg)">${c}</b>`:c).join(', ')}</div></div>`).join('')}
      <span class="small muted">계산 방식: 새상품 최저가 = 재고 있는 판매처 중 (판매가 + 배송비) 최소 · 중고 시세 = A급 판매완료 중간값(2건 이상일 때), 없으면 A급 매물 중간값 · 회수율 = 중고 시세 ÷ 새상품 최저가 · 중고 최저 = S·A급 판매중 매물 중 최저가.</span>
      <span class="small muted">이미지: 미리보기 환경에서는 외부 이미지 주소를 불러올 수 없어 카테고리 아이콘으로 대신 보여줘요.</span>
    </div>
  </div>`;
}

/* ---------- import ---------- */
function handleFile(file){
  if(!file)return;
  if(typeof XLSX==='undefined'){render(`<p class="err">엑셀 읽기 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.</p>`);return}
  const fr=new FileReader();
  fr.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const raw={},lines=[];let fatal=false;
      for(const s of Object.keys(SCHEMA)){
        const name=wb.SheetNames.find(n=>n.trim().toLowerCase()===s);
        if(!name){raw[s]=[];lines.push(s==='price_history'?`<li class="warn">${s} 시트 없음 (선택 항목이라 가상 추이로 대신해요)</li>`:`<li class="${s==='products'?'err':'warn'}">${s} 시트를 찾지 못했어요</li>`);if(s==='products')fatal=true;continue}
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:'',raw:true}).map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[String(k).trim(),typeof v==='string'?v.trim():v])));
        const cols=rows.length?Object.keys(rows[0]):[];
        const miss=REQUIRED[s].filter(c=>!cols.includes(c));
        if(miss.length){lines.push(`<li class="err">${s}: 필수 열 없음 (${miss.join(', ')})</li>`);if(s==='products')fatal=true}
        const clean=rows.filter(r=>!String(r.product_id||'').startsWith('EX-'));
        raw[s]=clean;
        const badPrice=['new_offers','used_offers'].includes(s)?clean.filter(r=>num(r.price)==null).length:0;
        lines.push(`<li class="ok">${s}: ${clean.length}행${badPrice?` <span class="warn">· 가격이 숫자가 아닌 행 ${badPrice}개 제외</span>`:''}</li>`);
      }
      if(fatal){render(`<div class="card report"><b>불러오지 못했어요</b><ul>${lines.join('')}</ul></div>`);return}
      const test=build(raw);
      const ids=new Set(test.list.map(p=>p.id));
      const orphan=[...raw.new_offers,...raw.used_offers].filter(r=>!ids.has(String(r.product_id||'').trim())).length;
      const noNew=test.list.filter(p=>!p.newLow).length,noUsed=test.list.filter(p=>!p.usedRef).length;
      if(orphan)lines.push(`<li class="warn">products에 없는 product_id를 가진 가격 행 ${orphan}개 (무시함)</li>`);
      if(noNew)lines.push(`<li class="warn">재고 있는 새상품 판매처가 없는 상품 ${noNew}개</li>`);
      if(noUsed)lines.push(`<li class="warn">중고 매물이 없는 상품 ${noUsed}개</li>`);
      lines.push(`<li class="ok">중고가 새상품보다 싼 상품 ${test.list.filter(p=>p.usedSave>0).length}개</li>`);
      if(!test.list.length){render(`<div class="card report"><b>상품이 0개예요</b><ul>${lines.join('')}</ul></div>`);return}
      SRC={raw,name:file.name,sample:false};DB=test;
      const ok=store.set(LS_DATA,SRC);
      UI.sellPid=null;
      render(`<div class="card report"><b class="ok">${esc(file.name)} 불러옴 · 상품 ${test.list.length}개</b><ul>${lines.join('')}</ul>${ok?'':'<span class="small warn">브라우저 저장소를 쓸 수 없어 새로고침하면 샘플로 돌아가요.</span>'}<a class="btn primary" href="#home" style="margin-top:8px">홈에서 보기</a></div>`);
    }catch(err){render(`<div class="card"><b class="err">파일을 읽지 못했어요</b><p class="small muted">.xlsx 형식인지 확인해 주세요. (${esc(err.message)})</p></div>`)}
  };
  fr.readAsArrayBuffer(file);
}

/* ---------- router ---------- */
function route(){const h=location.hash.replace('#','');if(h.startsWith('p-'))return['detail',h.slice(2)];return[['home','wallet','sell','data'].includes(h)?h:'home']}
function render(rep){
  const [r,arg]=route();
  document.querySelectorAll('.nav a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.r===r||(r==='detail'&&a.dataset.r==='home'))||a.setAttribute('aria-current',a.dataset.r===r||(r==='detail'&&a.dataset.r==='home')?'page':''));
  document.querySelectorAll('.nav a').forEach(a=>{const on=a.dataset.r===r||(r==='detail'&&a.dataset.r==='home');on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  $('#src').innerHTML=SRC.sample?'<b>샘플 데이터</b> · 시트 불러오기':`<b>${SRC.live?'실시간':'시트'}</b> · ${esc(SRC.name)} · ${DB.list.length}개`;
  const app=$('#app');
  app.innerHTML=r==='detail'?vDetail(arg):r==='wallet'?vWallet():r==='sell'?vSell():r==='data'?vData(typeof rep==='string'?rep:''):vHome();
  if(r==='data')bindDrop();
}
function bindDrop(){
  const d=$('#drop'),f=$('#file');if(!d)return;
  f.onchange=()=>handleFile(f.files[0]);
  d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');handleFile(e.dataTransfer.files[0])};
}
let lastRoute='';
window.addEventListener('hashchange',()=>{const r=location.hash;if(r!==lastRoute){lastRoute=r;render();window.scrollTo(0,0)}});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,tr');if(!t)return;
  const d=t.dataset;
  if(d.cat){UI.cat=d.cat;render();return}
  if(d.view){UI.view=d.view;$('#list').innerHTML=listHtml(filtered());document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===UI.view));return}
  if(d.go){location.hash='p-'+d.go;return}
  if(d.kind){UI.kind=d.kind;render();return}
  if(d.wm){UI.walletMode=d.wm;render();return}
  if(d.grade){UI.grade=d.grade;render();return}
  if(d.popt){UI.popt=+d.popt;render();return}
  if(d.del){removeFromWallet(+d.del);render();toast('지갑에서 뺐어요');return}
  if(d.sellpid){UI.sellPid=d.sellpid;UI.buy=+d.buy||null;return}
  if(t.id==='goSell'){UI.sellPid=d.pid;UI.buy=null;return}
  if(t.id==='buyNew'){const p=DB.by[d.pid];addToWallet(p.id,p.newLow);toast(`${p.name}을(를) ${won(p.newLow)}에 산 것으로 기록했어요`);return}
  if(t.id==='listIt'){toast('데모라서 실제로 등록되지는 않아요. 등록 화면 흐름만 확인할 수 있어요.');return}
  if(t.id==='reset'){store.del(LS_DATA);store.del(LS_API);location.reload();return}
  if(t.id==='saveApi'){const v=($('#apiUrl').value||'').trim();if(v&&!/^https:\/\//.test(v)){toast('https:// 로 시작하는 주소를 넣어주세요');return}v?store.set(LS_API,v):store.del(LS_API);store.del(LS_DATA);location.reload();return}
  if(t.id==='resetWallet'){store.del(LS_WALLET);render();toast('지갑 기록을 지웠어요');return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){UI.q=e.target.value;$('#list').innerHTML=listHtml(filtered())}
  if(e.target.id==='buyIn'){UI.buy=num(e.target.value);const pos=e.target.selectionStart;render();const el=$('#buyIn');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='sort'){UI.sort=e.target.value;$('#list').innerHTML=listHtml(filtered())}
  if(e.target.id==='sellPid'){UI.sellPid=e.target.value;const w=getWallet().find(h=>h.pid===UI.sellPid);UI.buy=w?w.price:null;render()}
});
lastRoute=location.hash;render();boot();
</script>
